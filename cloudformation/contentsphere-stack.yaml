AWSTemplateFormatVersion: '2010-09-09'

Description: >
  ContentSphere infrastructure for IT Vedant DR501.
  Creates a VPC, public subnet, Internet Gateway, route table,
  security group, EC2 instance, Elastic IP and S3 bucket.

Parameters:
  Environment:
    Type: String
    Default: dev

  InstanceType:
    Type: String
    Default: t3.micro

Resources:

  ContentSphereVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: contentsphere-cf-vpc
        - Key: Project
          Value: contentsphere
        - Key: Environment
          Value: !Ref Environment

  ContentSphereSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref ContentSphereVPC
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''

      Tags:
        - Key: Name
          Value: contentsphere-cf-public-subnet

  ContentSphereInternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: contentsphere-cf-igw

  ContentSphereGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref ContentSphereVPC
      InternetGatewayId: !Ref ContentSphereInternetGateway

  ContentSphereRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref ContentSphereVPC
      Tags:
        - Key: Name
          Value: contentsphere-cf-public-rt

  ContentSphereDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: ContentSphereGatewayAttachment
    Properties:
      RouteTableId: !Ref ContentSphereRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref ContentSphereInternetGateway

  ContentSphereRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref ContentSphereRouteTable
      SubnetId: !Ref ContentSphereSubnet

  ContentSphereSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for ContentSphere
      VpcId: !Ref ContentSphereVPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

      Tags:
        - Key: Name
          Value: contentsphere-cf-sg

  ContentSphereInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: !Ref InstanceType
      ImageId: ami-007b1f3fdea0383d9
      SubnetId: !Ref ContentSphereSubnet
      SecurityGroupIds:
        - !Ref ContentSphereSecurityGroup

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          apt-get update -y
          apt-get install -y apache2

          systemctl enable apache2
          systemctl start apache2

          cat > /var/www/html/index.html <<HTML
          <html>
          <head><title>ContentSphere - CloudFormation</title></head>
          <body>
          <h1>ContentSphere</h1>
          <p>Student Name: Saad Momin</p>
          <p>Batch Code: DR501</p>
          <p>AWS Region: ap-south-1</p>
          <p>Environment: ${Environment}</p>
          <h2>Infrastructure Provisioned using CloudFormation</h2>
          </body>
          </html>
          HTML

      Tags:
        - Key: Name
          Value: contentsphere-cf-server

  ContentSphereElasticIP:
    Type: AWS::EC2::EIP
    DependsOn: ContentSphereGatewayAttachment
    Properties:
      Domain: vpc
      InstanceId: !Ref ContentSphereInstance
      Tags:
        - Key: Name
          Value: contentsphere-cf-eip

  ContentSphereBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub contentsphere-cf-${AWS::AccountId}
      Tags:
        - Key: Name
          Value: contentsphere-cf-bucket
        - Key: Project
          Value: contentsphere
        - Key: Environment
          Value: !Ref Environment

Outputs:

  VPCId:
    Description: ContentSphere VPC ID
    Value: !Ref ContentSphereVPC

  SubnetId:
    Description: ContentSphere public subnet ID
    Value: !Ref ContentSphereSubnet

  InstanceId:
    Description: ContentSphere EC2 instance ID
    Value: !Ref ContentSphereInstance

  ElasticIP:
    Description: ContentSphere Elastic IP
    Value: !Ref ContentSphereElasticIP

  BucketName:
    Description: ContentSphere S3 bucket
    Value: !Ref ContentSphereBucket
